name: 🏭 Generic Android App Factory

on:
  # Enable manual triggering from the GitHub UI
  workflow_dispatch:
    inputs:
      APP_NAME:
        description: 'Display Name of the App (e.g., My Movie App)'
        required: true
        type: string
      APP_ID:
        description: 'Android Package ID (e.g., com.COMPANY.project)'
        required: true
        type: string
      ICON_ZIP_URL:
        description: 'URL to a ZIP file containing a single high-res icon (icon.png)'
        required: true
        type: string
      WEB_URL:
        description: 'The URL the app should load'
        required: true
        type: string
      BASE_VERSION:
        description: 'Base Version (e.g., 1.0)'
        required: true
        default: '1.0'
        type: string

env:
  # This is where the dynamic icon will be unzipped to
  ICON_PATH: 'assets/icon'

jobs:
  build-whitelabeled-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --offline || flutter pub get
          flutter pub global activate flutter_launcher_icons

      # -------------------------------------------------
      # ⚙️ WHITE-LABELING / TEMPLATING MAGIC
      # -------------------------------------------------

      - name: Inject App Name and Description
        env:
          APP_NAME: ${{ inputs.APP_NAME }}
          WEB_URL: ${{ inputs.WEB_URL }}
        run: |
          python3 -c '
          import os
          app_name = os.environ["APP_NAME"]
          web_url = os.environ["WEB_URL"]
          
          # Update pubspec.yaml
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          
          # Replace name and description safely
          lines = []
          for line in content.splitlines():
              if line.startswith("name:"):
                  lines.append(f"name: {app_name}")
              elif line.startswith("description:"):
                  lines.append(f"description: Wrapper for {app_name}")
              else:
                  lines.append(line)
                  
          with open("pubspec.yaml", "w") as f:
              f.write("\n".join(lines) + "\n")
          '

      - name: Inject Android Application ID and Namespace
        env:
          APP_ID: ${{ inputs.APP_ID }}
        run: |
          python3 - <<'EOF'
          import os, re
          app_id = os.environ["APP_ID"]
          
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()
              
          # 1. Replace namespace = "..."
          content = re.sub(r"namespace\s*=\s*\"[^\"]+\"", f"namespace = \"{app_id}\"", content)
          
          # 2. Replace applicationId = "..." in defaultConfig
          content = re.sub(r"applicationId\s*=\s*\"[^\"]+\"", f"applicationId = \"{app_id}\"", content)
          
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(content)
          EOF

      - name: Whitelabel App Title, Manifest Label, and Kotlin Package
        env:
          APP_NAME: ${{ inputs.APP_NAME }}
          APP_ID: ${{ inputs.APP_ID }}
        run: |
          python3 - <<'EOF'
          import os, re, glob, shutil

          app_name = os.environ["APP_NAME"]
          app_id = os.environ["APP_ID"]

          # 1. Update Title in lib/main.dart
          if os.path.exists("lib/main.dart"):
              with open("lib/main.dart", "r") as f:
                  content = f.read()
              content = re.sub(r"title:\s*['\"].*?['\"]", f"title: '{app_name}'", content)
              with open("lib/main.dart", "w") as f:
                  f.write(content)

          # 2. Update AndroidManifest.xml app label
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  content = f.read()
              content = re.sub(r'android:label="[^"]+"', f'android:label="{app_name}"', content)
              with open(manifest_path, "w") as f:
                  f.write(content)

          # 3. Update package declaration in MainActivity.kt / .java and move folder structure
          main_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.*", recursive=True)
          if not main_files:
              main_files = glob.glob("android/app/src/main/java/**/MainActivity.*", recursive=True)

          if main_files:
              main_file = main_files[0]
              with open(main_file, "r") as f:
                  content = f.read()
              
              content = re.sub(r"package\s+[\w\.]+", f"package {app_id}", content)
              with open(main_file, "w") as f:
                  f.write(content)

              new_dir_parts = app_id.split('.')
              base_dir = "android/app/src/main/kotlin" if "kotlin" in main_file else "android/app/src/main/java"
              target_dir = os.path.join(base_dir, *new_dir_parts)
              os.makedirs(target_dir, exist_ok=True)
              
              target_file = os.path.join(target_dir, os.path.basename(main_file))
              if os.path.abspath(main_file) != os.path.abspath(target_file):
                  shutil.move(main_file, target_file)
          EOF

      - name: Download and Process Dynamic Icon
        run: |
          mkdir -p $ICON_PATH
          echo "Downloading icons from ${{ inputs.ICON_ZIP_URL }}..."
          curl -L "${{ inputs.ICON_ZIP_URL }}" -o icons.zip
          unzip -q icons.zip -d $ICON_PATH
          
          if [ ! -f "$ICON_PATH/icon.png" ]; then
            echo "Error: icon.png not found inside the downloaded ZIP root."
            exit 1
          fi

          echo "Generating launcher icons..."
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Set Version (Semantic + Build Number)
        id: version
        run: |
          MAJOR_MINOR="${{ inputs.BASE_VERSION }}"
          PATCH="${{ github.run_number }}"
          FULL_VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "Setting Version to: $FULL_VERSION"
          
          # Update pubspec
          sed -i "s/^version:.*/version: $FULL_VERSION/" pubspec.yaml
          
          # Pass version info to the release job step outputs
          echo "version-number=$FULL_VERSION" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 🚀 BUILD AND RELEASE
      # -------------------------------------------------

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Determine Output Filename
        id: filename
        run: |
          CLEAN_NAME=$(echo "${{ inputs.APP_NAME }}" | tr -cd '[:alnum:]_')
          echo "APK_NAME=${CLEAN_NAME}_v${{ steps.version.outputs.version-number }}" >> $GITHUB_OUTPUT

      - name: Archive APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.APK_NAME }}-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Archive AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.APK_NAME }}-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version-number }}_${{ steps.filename.outputs.APK_NAME }}
          name: ${{ inputs.APP_NAME }} - ${{ steps.version.outputs.version-number }}
          body: |
            Auto-generated build for ${{ inputs.APP_NAME }}
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}