name: 🏭 Generic Android App Factory

on:
  # Enable manual triggering from the GitHub UI
  workflow_dispatch:
    inputs:
      APP_NAME:
        description: 'Display Name of the App (e.g., My Movie App)'
        required: true
        type: string
      APP_ID:
        description: 'Android Package ID (e.g., com.COMPANY.project)'
        required: true
        type: string
      ICON_ZIP_URL:
        description: 'URL to a ZIP file containing a single high-res icon (icon.png)'
        required: true
        type: string
      WEB_URL:
        description: 'The URL the app should load'
        required: true
        type: string
      BASE_VERSION:
        description: 'Base Version (e.g., 1.0)'
        required: true
        default: '1.0'
        type: string

env:
  # This is where the dynamic icon will be unzipped to
  ICON_PATH: 'assets/dynamic_icon'

jobs:
  build-whitelabeled-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub global activate flutter_launcher_icons

      # -------------------------------------------------
      # ⚙️ WHITE-LABELING / TEMPLATING MAGIC STARTS HERE
      # -------------------------------------------------

      - name: 1. Inject App Name and Description
        env:
          APP_NAME: ${{ inputs.APP_NAME }}
          WEB_URL: ${{ inputs.WEB_URL }}
        run: |
          python3 -c '
          import os
          app_name = os.environ["APP_NAME"]
          web_url = os.environ["WEB_URL"]
          
          # Update pubspec.yaml
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          
          # Replace name and description safely
          lines = []
          for line in content.splitlines():
              if line.startswith("name:"):
                  lines.append(f"name: {app_name}")
              elif line.startswith("description:"):
                  lines.append(f"description: Wrapper for {web_url}")
              else:
                  lines.append(line)
                  
          with open("pubspec.yaml", "w") as f:
              f.write("\n".join(lines) + "\n")
          '

      - name: 2. Inject Android Application ID (Package Name)
        env:
          APP_ID: ${{ inputs.APP_ID }}
        run: |
          python3 -c '
          import os, re
          app_id = os.environ["APP_ID"]
          
          with open("android/app/build.gradle", "r") as f:
              content = f.read()
              
          # Replace applicationId "..."
          new_content = re.sub(r"applicationId\s+\"[^\"]+\"", f"applicationId \"{app_id}\"", content)
          
          with open("android/app/build.gradle", "w") as f:
              f.write(new_content)
          '

      - name: 4. Inject Web URL into Dart Code
        env:
          WEB_URL: ${{ inputs.WEB_URL }}
        run: |
          python3 -c '
          import os, re
          web_url = os.environ["WEB_URL"]
          
          with open("lib/constants.dart", "r") as f:
              content = f.read()
              
          # Replace webUrl constant safely
          new_content = re.sub(r"const\s+String\s+webUrl\s*=\s*\".*?\";", f"const String webUrl = \"{web_url}\";", content)
          
          with open("lib/constants.dart", "w") as f:
              f.write(new_content)
          '

      - name: 5. Set Version (Semantic + Build Number)
        run: |
          MAJOR_MINOR="${{ inputs.BASE_VERSION }}"
          PATCH="${{ github.run_number }}"
          FULL_VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "Setting Version to: $FULL_VERSION"
          
          # Update pubspec
          sed -i "s/^version:.*/version: $FULL_VERSION/" pubspec.yaml

      # -------------------------------------------------
      # 🚀 BUILD AND RELEASE
      # -------------------------------------------------

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Determine Output Filename
        id: filename
        run: |
          # Create a clean filename based on app name and version
          CLEAN_NAME=$(echo "${{ inputs.APP_NAME }}" | tr -cd '[:alnum:]_')
          echo "APK_NAME=${CLEAN_NAME}_v${{ steps.version.outputs.version-number }}" >> $GITHUB_OUTPUT

      - name: Archive APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.APK_NAME }}-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Archive AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.APK_NAME }}-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version-number }}_${{ steps.filename.outputs.APK_NAME }}
          name: ${{ inputs.APP_NAME }} - ${{ steps.version.outputs.version-number }}
          body: |
            Auto-generated build for ${{ inputs.APP_NAME }}
            Source URL: ${{ inputs.WEB_URL }}
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}